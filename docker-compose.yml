version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeground-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/safeground
      - JWT_SECRET=safeground_production_secret_key_2025
      - CLIENT_URL=*
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: safeground-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
